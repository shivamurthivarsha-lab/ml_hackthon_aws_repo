version: '3.8'

services:
  smart-campus-hub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-campus-hub-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=smart-campus-production-jwt-secret-key-2026
    volumes:
      - app-data:/app/backend/data.json

volumes:
  app-data:
